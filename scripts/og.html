<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital@1&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#7a1a2b 0%,#430b16 60%,#24060c 100%);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif}
.card{position:relative;width:1040px;height:500px;background:#fbf6ec;border-radius:6px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card:before,.card:after{content:'';position:absolute;border:1.5px solid rgba(184,137,59,.6);inset:16px;border-radius:3px}
.card:after{inset:24px;border-color:rgba(184,137,59,.3)}
.deva{font-family:'Tiro Devanagari Hindi';color:#6E1423;font-size:24px}
.names{font-family:'Great Vibes';color:#6E1423;font-size:104px;line-height:1.05;margin-top:10px}
.amp{color:#B8893B}
.sub{font-family:Cinzel;letter-spacing:.35em;color:#B8893B;font-size:20px;margin-top:14px;text-transform:uppercase}
.date{font-family:Cinzel;letter-spacing:.12em;color:#2a1e17;font-size:30px;margin-top:22px}
.loc{font-style:italic;color:#5a4636;font-size:28px;margin-top:6px}
</style></head><body><div class="card">
<div class="deva">॥ श्री गणेशाय नमः ॥</div>
<div class="names">Himani <span class="amp">&amp;</span> Lovenish</div>
<div class="sub">We're getting married</div>
<div class="date">25th &amp; 26th November 2026</div>
<div class="loc">Varmala Resort &amp; Banquet · Jaipur, Rajasthan</div>
</div></body></html>
